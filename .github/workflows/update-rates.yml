name: Update rates

on:
  schedule:
    # Every day at 01:00 UTC (09:00 Taiwan). GitHub may start scheduled runs
    # a few minutes to an hour late under load; the app only refetches every
    # 12 hours, so that does not matter.
    - cron: '0 1 * * *'
  # Manual "Run workflow" button, for testing.
  workflow_dispatch:

# Lets the built-in GITHUB_TOKEN push the updated rates.json.
# Declared here so no repo setting has to be changed by hand.
permissions:
  contents: write

concurrency:
  group: update-rates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests (offline)
        run: python3 -m unittest discover -s scripts -v

      - name: Fetch and validate
        run: python3 scripts/update_rates.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- rates.json && git ls-files --error-unmatch rates.json >/dev/null 2>&1; then
            echo "rates.json unchanged"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rates.json
          git commit -m "rates: $(python3 -c "import json;print(json.load(open('rates.json'))['date'])")"
          git push
